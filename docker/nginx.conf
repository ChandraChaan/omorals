# Mirrors the Firebase Hosting behaviour in firebase.json.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # pinned third-party libraries never change
  location /vendor/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # the workspace is a single-page app: every path under /app/ loads it
  location /app/ {
    try_files $uri $uri/ /app/index.html;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
