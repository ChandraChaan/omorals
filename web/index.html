<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="OMorals Workspace: tasks, video pipeline and call tracking for the OMorals Media team.">
  <meta name="theme-color" content="#0b1020">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OMorals">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>OMorals Workspace</title>
  <style>
    html, body { height: 100%; margin: 0; background: #f5f3ee; }
    #boot {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      background: #0b1020; color: #f3eee5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .45s ease, visibility 0s .45s;
    }
    #boot.is-out { opacity: 0; visibility: hidden; }
    #boot .box { display: grid; justify-items: center; gap: 22px; }
    #boot svg { width: 76px; height: 76px; overflow: visible; }
    #boot .track { fill: none; stroke: rgba(243, 238, 229, .12); stroke-width: 9; }
    #boot .arc {
      fill: none; stroke: #f3eee5; stroke-width: 9; stroke-linecap: round;
      stroke-dasharray: 60 200; transform-origin: 40px 40px;
      animation: boot-spin 1.1s cubic-bezier(.6, .1, .3, .9) infinite;
    }
    #boot .play { fill: #ff5a1f; transform-origin: 42px 40px; animation: boot-pulse 1.1s ease-in-out infinite; }
    #boot p { margin: 0; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: #a9a59c; }
    #boot b { color: #f3eee5; font-weight: 600; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @keyframes boot-pulse { 50% { transform: scale(.82); } }
    @media (prefers-reduced-motion: reduce) { #boot .arc, #boot .play { animation: none; } }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-label="Loading OMorals Workspace">
    <div class="box">
      <svg viewBox="0 0 80 80" aria-hidden="true">
        <circle class="track" cx="40" cy="40" r="30"/>
        <circle class="arc" cx="40" cy="40" r="30"/>
        <path class="play" d="M34 29 L53 40 L34 51 Z"/>
      </svg>
      <p><b>OMorals</b> Workspace</p>
    </div>
  </div>

  <script>
    // Fade the boot screen out once Flutter has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('is-out');
      setTimeout(function () { boot.remove(); }, 600);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
