name: Build and deploy

# main            -> live site (https://omorals.web.app) + Firestore rules
# pull requests   -> checks + a temporary preview URL posted in the job summary
# every morning   -> rebuild so "Latest from the channel" shows new videos
# manual          -> "Run workflow" button in the Actions tab

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FIREBASE_PROJECT: omorals
  FLUTTER_VERSION: "3.44.5"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build website + workspace
        run: tool/build.sh

      - name: Authenticate to Google Cloud
        id: auth
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OMORALS }}

      - name: Deploy live
        if: github.event_name != 'pull_request'
        run: npx --yes firebase-tools@15 deploy --project "$FIREBASE_PROJECT" --only hosting,firestore --non-interactive

      - name: Deploy preview
        if: github.event_name == 'pull_request' && steps.auth.outcome == 'success'
        run: |
          npx --yes firebase-tools@15 hosting:channel:deploy "pr-${{ github.event.number }}" \
            --project "$FIREBASE_PROJECT" --expires 7d --non-interactive --json > preview.json
          URL=$(python3 -c "import json;d=json.load(open('preview.json'));print(next(iter(d['result'].values()))['url'])")
          echo "### Preview: $URL" >> "$GITHUB_STEP_SUMMARY"
